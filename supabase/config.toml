# Supabase CLI configuration for local development (`npx supabase start`).
project_id = "flowmont"

[api]
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
# The web app URL used in auth e-mails. Add every preview/production domain below.
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "http://localhost:8081/auth/callback",
  "http://localhost:8081/auth/reset",
  "flowmont://auth/callback",
  "flowmont://auth/reset",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

[storage]
file_size_limit = "20MiB"

[functions.billing-webhook]
verify_jwt = false
